<!doctype html>
<html lang="pt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><title>Super Hang-On | Motor original</title>
<style>
*{box-sizing:border-box;touch-action:none}body{margin:0;background:#111;color:white;font:15px system-ui;overscroll-behavior:none}main{height:100dvh;display:grid;place-items:center}canvas{height:100%;width:auto;max-width:100%;aspect-ratio:4/3;image-rendering:pixelated;object-fit:contain}button{background:#222c;color:#fff;border:1px solid #aaa;border-radius:12px;padding:12px;min-height:42px;font:700 14px system-ui;user-select:none}#setup{position:absolute;background:#161a21;padding:20px;max-width:90%;border-radius:12px;z-index:2}#controls{position:absolute;inset:0;pointer-events:none;display:none}#controls button{pointer-events:auto}#left,#right{position:absolute;bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:6px;align-items:end}#left{left:max(10px,env(safe-area-inset-left))}#right{right:max(10px,env(safe-area-inset-right))}#top{position:absolute;top:8px;left:8px;display:flex;gap:5px}#rotate{display:none;position:absolute;inset:0;z-index:3;background:#111;place-items:center;text-align:center} @media(orientation:portrait){#rotate{display:grid}} [hidden]{display:none!important}
</style><main><canvas id="screen" width="320" height="224"></canvas><div id="setup"><h2>Super Hang-On</h2><p>Motor arcade recompilado. Seleciona a tua ROM shangon.zip.</p><input type="file" id="rom" accept=".zip"><p id="status">A carregar módulo WebAssembly...</p><button id="go" disabled>Iniciar e autorizar inclinação</button></div><div id="controls"><div id="top"><button id="credit">START</button><button id="cal">CALIBRAR</button></div><div id="left"><button data-key="left">◀</button><button data-key="right">▶</button><button data-key="brake">TRAVÃO</button></div><div id="right"><button data-key="turbo">TURBO</button><button data-key="throttle">ACELERAR</button></div></div><div id="rotate">Roda o telemóvel para jogar na horizontal.</div></main>
<script src="sho.js"></script><script>
"use strict";
const $=id=>document.getElementById(id), c=$("screen"), ctx=c.getContext("2d",{alpha:false});
let m, running=false, ac, audioTime=0,last=0,carry=0,neutral=null,raw=0,steer=0,coin=0,start=0,queuedStart=false,frameData=null;
const keys=new Set(), latched=new Map(), STEP=1000/60.05460;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const landscape=()=>innerWidth>innerHeight;
async function init(){try{if(typeof createShoModule!=="function")throw Error("Módulo sho.js ainda não compilado.");m=await createShoModule();$("status").textContent="Seleciona o ZIP original."; $("go").disabled=false}catch(e){$("status").textContent=e.message}}
function angle(){return screen.orientation?.angle??window.orientation??0}
window.addEventListener("deviceorientation",e=>{if(e.beta==null||!landscape())return;raw=(angle()===-90||angle()===270)?-e.beta:e.beta;if(neutral===null)neutral=raw;});
window.addEventListener("orientationchange",()=>{neutral=null;keys.clear();latched.clear()});
$("cal").onclick=()=>{neutral=raw;steer=0};
$("credit").onclick=()=>{coin=4;queuedStart=true};
for(const b of document.querySelectorAll("[data-key]")){b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);latched.set(e.pointerId,b.dataset.key);keys.add(b.dataset.key)};const release=e=>{let k=latched.get(e.pointerId);latched.delete(e.pointerId);if(k&&![...latched.values()].includes(k))keys.delete(k)};b.onpointerup=b.onpointercancel=b.onlostpointercapture=release}
window.addEventListener("blur",()=>{keys.clear();latched.clear()});
document.addEventListener("visibilitychange",()=>{keys.clear();latched.clear();last=0;carry=0});
$("go").onclick=async()=>{try{const file=$("rom").files[0];if(!file)throw Error("Seleciona shangon.zip.");if(!landscape())throw Error("Roda o telemóvel.");if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){try{await DeviceOrientationEvent.requestPermission()}catch{}}ac=new (window.AudioContext||window.webkitAudioContext)({sampleRate:48000});await ac.resume();m.FS.writeFile("/shangon.zip",new Uint8Array(await file.arrayBuffer()));if(m.ccall("browser_load","number",["string"],["/shangon.zip"]))throw Error(m.ccall("browser_error","string",[],[]));neutral=null;running=true;$("setup").hidden=true;$("controls").style.display="block";requestAnimationFrame(tick)}catch(e){$("status").textContent=e.message; if(ac)await ac.close().catch(()=>{})}};
function sound(){const frames=m._browser_audio_frames();if(!frames||!ac||ac.state!=="running")return;const p=m._browser_audio()>>1, samples=m.HEAP16;const buf=ac.createBuffer(2,frames,48000);for(let ch=0;ch<2;ch++){let a=buf.getChannelData(ch);for(let i=0;i<frames;i++)a[i]=samples[p+i*2+ch]/32768}if(audioTime<ac.currentTime||audioTime>ac.currentTime+.15)audioTime=ac.currentTime+.035;const node=ac.createBufferSource();node.buffer=buf;node.connect(ac.destination);node.start(audioTime);audioTime+=frames/48000}
function step(){const manual=Number(keys.has("right"))-Number(keys.has("left"));const target=manual||clamp((raw-(neutral??raw))/30,-1,1);steer+=(target-steer)*.25;m._browser_input(steer,+keys.has("throttle"),+keys.has("brake"),+keys.has("turbo"),+(start>0),+(coin>0),0,0,+keys.has("left"),+keys.has("right"));if(coin>0){if(--coin===0&&queuedStart){start=5;queuedStart=false}}else if(start>0)start--;m._browser_frame();sound()}
function draw(){const w=m._browser_width(),h=m._browser_height(),ptr=m._browser_pixels();if(!w||!h||!ptr)return;if(c.width!==w||c.height!==h){c.width=w;c.height=h;frameData=null}if(!frameData)frameData=ctx.createImageData(w,h);const src=m.HEAPU32;const ix=ptr>>>2,d=frameData.data;for(let i=0;i<w*h;i++){const v=src[ix+i];d[i*4]=v>>>16&255;d[i*4+1]=v>>>8&255;d[i*4+2]=v&255;d[i*4+3]=255}ctx.putImageData(frameData,0,0)}
function tick(t){if(!running)return;if(!landscape()||document.hidden){last=0;carry=0;requestAnimationFrame(tick);return}carry+=last?Math.min(t-last,80):STEP;last=t;let n=0;while(carry>=STEP&&n++<4){step();carry-=STEP}draw();requestAnimationFrame(tick)}
init();
</script></html>
