<!doctype html>
<html lang="pt-PT">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Super Hang-On | PCB Native V2.5</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#0b1018;color:#fff;font:16px system-ui;padding:18px}main{width:min(100%,480px);background:#151d29;border:1px solid #354255;border-radius:20px;padding:24px}h1{font-size:25px;margin:8px 0}p{line-height:1.5;color:#cbd5e1}label{display:block;background:#223043;padding:14px;border:1px solid #50637e;border-radius:10px;margin:16px 0}input{display:block;max-width:100%;margin-top:10px;color:#fff}button{width:100%;padding:14px;border:0;background:#d7ed44;color:#131800;font:bold 17px system-ui;border-radius:10px}button:disabled{opacity:.4}small{color:#b8c7db}#status{min-height:24px;color:#ffd88a}#remove{background:none;color:#a7b6ca;font:13px system-ui;margin-top:8px} [hidden]{display:none!important}
</style></head><body><main><small>SEGA ARCADE • PCB NATIVE</small><h1>Super Hang-On V2.5</h1><small>Consola horizontal · A B C · Cristal verde</small><p id="intro">A verificar a instalação neste dispositivo…</p><label id="import" hidden>Instalar pacote privado<input type="file" id="game" accept=".txt,.sho,.html,text/plain,text/html"></label><button id="launch" disabled>JOGAR</button><p id="status" role="status"></p><button id="remove" hidden>Remover instalação local</button><small>O jogo é guardado no Safari deste dispositivo. Não é enviado ao servidor.</small></main>
<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id),game=$('game'),button=$('launch'),status=$('status');
const expected='0b910a0e7585da7f5228ead8e85e130725c9c215d827acff34fe6cb80171f91a';
const dbname='umbrella-sho-local-v21',key='private-game-v21';
let source='',db;
function openDB(){return new Promise((resolve,reject)=>{const q=indexedDB.open(dbname,1);q.onupgradeneeded=()=>q.result.createObjectStore('games');q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error);q.onblocked=()=>reject(new Error('Base de dados bloqueada'));});}
function read(){return new Promise((resolve,reject)=>{const q=db.transaction('games','readonly').objectStore('games').get(key);q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error);});}
function write(value){return new Promise((resolve,reject)=>{const t=db.transaction('games','readwrite');t.objectStore('games').put(value,key);t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error);});}
function remove(){return new Promise((resolve,reject)=>{const t=db.transaction('games','readwrite');t.objectStore('games').delete(key);t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error);});}
async function validated(bytes){
if(!(bytes instanceof ArrayBuffer)||bytes.byteLength<1000000||bytes.byteLength>12000000)throw Error('Seleciona o pacote completo V2.1.');
const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),b=>b.toString(16).padStart(2,'0')).join('');
if(digest!==expected)throw Error('Pacote incorreto ou alterado. Usa o ficheiro privado V2.1 original.');
const t=new TextDecoder().decode(bytes);
if(!t.includes('Super Hang-On | PCB Native V2.1')||!t.includes('createShoModule')||!t.includes('browser_completed_frames'))throw Error('Formato inválido.');
return t;
}
function ready(saved){
$('intro').textContent=saved?'Jogo instalado. Carrega em JOGAR.':'Pacote pronto nesta sessão. Carrega em JOGAR.';
status.textContent=saved?'Instalação local concluída. Nas próximas visitas não precisas do ficheiro.':'O Safari não permitiu guardar o jogo; será necessário voltar a selecionar o pacote.';
$('import').hidden=true;$('remove').hidden=!saved;button.disabled=false;
}
function needsFile(message=''){
source='';button.disabled=true;$('remove').hidden=true;$('import').hidden=false;$('intro').textContent='Na primeira visita, seleciona Super-Hang-On-V2.1.txt. Nas seguintes, basta abrir este endereço.';status.textContent=message;
}
async function init(){
try{db=await openDB();const bytes=await read();if(bytes){source=await validated(bytes);ready(true);if(new URLSearchParams(location.search).get('manage')!=='1'){launch();return;}return;}}catch(e){console.warn('Local install',e)}needsFile();
}
game.onchange=async()=>{
button.disabled=true;source='';
try{const f=game.files[0];if(!f){needsFile();return;}status.textContent='A verificar e instalar…';const bytes=await f.arrayBuffer();source=await validated(bytes);let saved=false;try{db=db||await openDB();await write(bytes);saved=true;}catch(e){console.warn('Storage unavailable',e)}ready(saved);launch();}catch(e){needsFile(e.message);}
};
$('remove').onclick=async()=>{try{if(db)await remove();game.value='';needsFile('Instalação removida.');}catch(e){status.textContent='Não foi possível remover: '+e.message;}};
function patchedGame(source){
  const replace=(a,b)=>{if(!source.includes(a))throw Error('Atualização V2.3: elemento ausente '+a.slice(0,70));source=source.replace(a,b)};
  source=source.replaceAll('PCB Native V2.1','PCB Native V2.3').replaceAll('ROM pronta. Roda o ecrã e inicia.','ROM pronta. Liga a máquina.');
  replace('Iniciar e autorizar inclinação','LIGAR MÁQUINA');
  replace('<button id="credit">START</button><button id="cal">CALIBRAR</button><button id="resume" hidden>ATIVAR SOM</button><span id="motion">Inclinação: a aguardar</span>','<button id="coin">COIN</button><button id="credit">START</button><button id="resume" hidden>SOM</button>');
  replace('<button data-key="brake">TRAVÃO</button></div><div id="right">','</div><div id="right"><button data-key="brake">TRAVÃO</button>');
  replace('<div id="rotate">Roda o telemóvel para jogar na horizontal.</div>','');
  replace('</style>',`main{position:relative;width:min(100vw,56.25dvh);height:min(100dvh,177.7778vw);margin:auto;display:block;background:linear-gradient(180deg,#1b2940,#090d15);border:1px solid #344559;border-radius:12px;overflow:hidden}body{display:grid;place-items:center}canvas{position:absolute;top:12%;left:0;width:100%;height:auto;aspect-ratio:10/7;object-fit:contain;background:#000;border-block:2px solid #40516a;box-shadow:0 8px 24px #0008}#setup{top:50%;left:50%;transform:translate(-50%,-50%);width:90%}#top{top:2%;left:3%;right:3%;justify-content:center;gap:8px}#top button{padding:8px 14px;min-height:40px;font-size:13px}#left,#right{bottom:7%;gap:8px;align-items:center}#left{left:4%;width:46%}#right{right:4%;width:41%;flex-direction:column;align-items:stretch}#left button{width:50%;height:clamp(52px,17vw,80px);font-size:26px}#right button{height:clamp(44px,12vw,63px);padding:5px;font-size:13px}#controls button{background:linear-gradient(#394a60,#172337);border:1px solid #718aa4;box-shadow:0 3px 0 #070b13}#controls button[data-key="throttle"]{background:linear-gradient(#387a4e,#16482b)}#controls button[data-key="brake"]{background:linear-gradient(#954540,#502523)}#controls button:active{background:#718942;transform:translateY(2px)}#controls button[data-key]:active{filter:brightness(1.5)}#coin{color:#ffe177}#credit{color:#9deca5}</style>`);
  const first=source.indexOf('function angle(){'),last=source.indexOf('$("credit").onclick=',first);if(first<0||last<0)throw Error('Atualização V2.3: sensores');source=source.slice(0,first)+'window.addEventListener("orientationchange",()=>{resetInputs();resetAudio();});\n'+source.slice(last);
  replace('$("credit").onclick=()=>{start=5};','$("coin").onclick=()=>{if(coin===0)coin=10};$("credit").onclick=()=>{if(coin===0)start=5;else queuedStart=true};');
  replace('if(e.code==="Enter"){','if(e.code==="Digit5"){e.preventDefault();if(!e.repeat&&coin===0)coin=10;return}if(e.code==="Enter"){');
  replace('if(!landscape())throw Error("Roda o telemóvel.");','');
  const a=source.indexOf('// Call both gesture-sensitive APIs'),b=source.indexOf('m.FS.writeFile("/shangon.zip"',a);if(a<0||b<0)throw Error('Atualização V2.3: permissões');source=source.slice(0,a)+'await unlockSound();\n'+source.slice(b);
  replace('neutral=null;running=true;','m._browser_dips(255,255);neutral=null;running=true;');
  replace('const delta=((raw-(neutral??raw)+540)%360)-180;const target=manual||(sensorSeen?clamp((Math.abs(delta)<2?0:delta)/30,-1,1):0);','const target=manual;');
  replace('if(!landscape()||document.hidden)','if(document.hidden)');
  replace('const landscape=()=>innerWidth>innerHeight;','');
  return source;
}
function consolePatch(source){
 const replace=(a,b)=>{if(!source.includes(a))throw Error('V2.5: '+a.slice(0,70));source=source.replace(a,b)};
 source=source.replaceAll('PCB Native V2.3','PCB Native V2.5');
 replace('<div id="left"><button data-key="left">◀</button><button data-key="right">▶</button></div><div id="right"><button data-key="brake">TRAVÃO</button><button data-key="turbo">TURBO</button><button data-key="throttle">ACELERAR</button></div>','<div id="left"><span class="padlabel">DIRECTION</span><div class="direction"><button data-key="left" aria-label="Esquerda">◀</button><button data-key="right" aria-label="Direita">▶</button></div></div><div id="right"><span class="padlabel">ACTION</span><div class="actions"><button data-key="throttle" aria-label="Acelerar"><b>A</b><small>ACELERAR</small></button><button data-key="brake" aria-label="Travar"><b>B</b><small>TRAVAR</small></button><button data-key="turbo" aria-label="Turbo"><b>C</b><small>TURBO</small></button></div></div>');
 replace('</style>',`body{background:#080c0d}main{width:100vw;height:100dvh;border-radius:0;border:0;background:linear-gradient(155deg,#465056 0%,#222a2e 18%,#11171a 60%,#313d40 100%);box-shadow:inset 0 0 0 3px #566563,inset 0 0 0 6px #101718,inset 0 -10px 24px #0009}canvas{left:50%;top:50%;transform:translate(-50%,-50%);width:min(52%,125dvh);height:auto;aspect-ratio:10/7;border:0;outline:4px solid #0a1011;border-radius:5px;box-shadow:0 0 0 9px #384745,0 0 0 12px #111a19,0 12px 24px #0009}#top{top:max(2%,env(safe-area-inset-top));left:26%;right:26%;z-index:2}#top button{min-height:30px;padding:5px 12px;background:linear-gradient(#3c5951,#142a22);border-color:#56766a;font-size:11px}#left,#right{position:absolute;top:20%;bottom:12%;width:22%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;border:1px solid #53625e;border-radius:22px;background:repeating-linear-gradient(120deg,#fff03 0 1px,transparent 1px 8px),linear-gradient(145deg,#273431,#101817);box-shadow:inset 0 2px 5px #ffffff18,inset 0 -8px 22px #0008,0 4px 8px #0008}#left{left:max(1%,env(safe-area-inset-left))}#right{right:max(1%,env(safe-area-inset-right))}.padlabel{font:700 clamp(8px,1.2vw,12px) system-ui;letter-spacing:2px;color:#9daea6}.direction,.actions{display:flex;align-items:center;justify-content:center;gap:5px;width:100%;padding:5px}.actions{transform:rotate(-12deg)}#controls #left button,#controls #right button{position:relative;overflow:hidden;transform:none;border-radius:50%;width:min(9vw,17dvh);height:min(9vw,17dvh);min-width:0;min-height:0;padding:0;border:1px solid #a4ffcb;background:radial-gradient(ellipse at 34% 18%,#f5fff9 0%,#96ffc3 13%,#30d974 36%,#087b3c 68%,#063c25 100%);color:#fff;text-shadow:0 1px 3px #00391e;box-shadow:inset 0 2px 3px #fff9,inset 0 -6px 8px #003f27,0 4px 0 #082a1b,0 0 10px #31fa8890;font-size:clamp(18px,3vw,30px)}#controls #right button{width:min(6.4vw,13dvh);height:min(6.4vw,13dvh);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(12deg);font-size:clamp(15px,2.4vw,25px)}#controls #right button small{font-size:clamp(5px,.8vw,9px);font-weight:800;color:white}#controls #left button::before,#controls #right button::before{content:"";position:absolute;top:7%;left:18%;width:60%;height:22%;background:linear-gradient(#fffe,#fff0);border-radius:50%;pointer-events:none}#controls #left button:active,#controls #right button:active{filter:brightness(1.35);box-shadow:inset 0 3px 9px #003f27,0 1px 0 #082a1b,0 0 16px #5aff9a;translate:0 3px}#setup{z-index:5}#orientation-hint{display:none;position:absolute;inset:0;background:#101817;color:white;z-index:10;place-items:center;text-align:center;font-size:20px}@media(orientation:portrait){#orientation-hint{display:grid}} </style>`);
 replace('</div></main>','</div><div id="orientation-hint">↻ Roda o telemóvel para jogar na horizontal.</div></main>');
 replace('const keyboard={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"throttle",ArrowDown:"brake",Space:"turbo"};','const keyboard={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"throttle",ArrowDown:"brake",Space:"turbo",KeyA:"throttle",KeyB:"brake",KeyC:"turbo"};');
 replace('if(document.hidden){if(last)','if(innerWidth<innerHeight||document.hidden){if(last)');
 return source;
}
function launch(){if(!source)return;try{const gameDocument=consolePatch(patchedGame(source));document.open();document.write(gameDocument);document.close();}catch(e){status.textContent=e.message;}}
button.onclick=launch;
init();
})();
</script></body></html>
