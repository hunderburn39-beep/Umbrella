<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Fortuna 777 V7</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04140d;color:#ffe6a6;font-family:system-ui,sans-serif;overscroll-behavior:none;touch-action:none}body{display:grid;place-items:center}main{width:min(98vw,166vh);max-height:98vh;display:flex;flex-direction:column;align-items:center;gap:1vh;padding:1vh 2vw;border:2px solid #b58a38;border-radius:16px;background:radial-gradient(ellipse at top,#246647,#062b1c 65%,#03150c);box-shadow:inset 0 0 20px #000}h1{font-size:clamp(22px,5vh,45px);line-height:1;margin:0;color:#ffda74;text-shadow:0 2px #6d3900,0 4px 8px #000;letter-spacing:.1em}small{font-size:11px;opacity:.85}canvas{display:block;width:100%;height:auto;max-height:58vh;object-fit:contain;background:#13271c;border-radius:8px}.stats,.controls{display:flex;width:100%;gap:1vw;justify-content:space-between;align-items:center}.stats{font-size:clamp(11px,2.4vh,18px);font-weight:700}.controls button{flex:1;color:#ffdf87;border:1px solid #e1b75b;border-radius:8px;background:linear-gradient(#267047,#103322);font-weight:bold;font-size:clamp(11px,2.8vh,20px);min-height:42px;padding:5px;touch-action:manipulation}.controls button:disabled{opacity:.5}.controls #spin{flex:2;background:linear-gradient(#ffe08c,#bd7d24);color:#201400}#status{min-height:1.3em;font-size:clamp(11px,2vh,16px);text-align:center}#error{white-space:pre-wrap;color:#ffb4a7;font-size:12px}@media(orientation:portrait){main{width:96vw}canvas{max-height:50vh}}</style></head>
<body><main><h1>FORTUNA 777</h1><small>V7.0 • Créditos virtuais • Canvas 2D</small><canvas id="board" width="840" height="300">O navegador não suporta Canvas.</canvas><div class="stats"><span id="balance">CRÉDITOS: 500</span><span id="win">PRÉMIO: 0</span></div><div id="status">A iniciar...</div><div class="controls"><button id="bet">APOSTA: 1</button><button id="lines">LINHAS: 5</button><button id="spin">RODAR</button><button id="mute" aria-label="Som">SOM</button></div><div id="error" role="alert"></div></main>
<script>
(function(){
'use strict';
var err=document.getElementById('error'),status=document.getElementById('status');
function fail(e){err.textContent='Erro: '+(e&&e.message?e.message:e);status.textContent='Falha de inicialização';}
window.addEventListener('error',function(e){fail(e.error||e.message)});
try{
var canvas=document.getElementById('board'),ctx=canvas.getContext('2d');if(!ctx)throw Error('Canvas 2D indisponível');
var reels=[
'CH LE OR GR CH BE LE SE CH OR GR LE ST CH OR BE LE GR CH ST',
'LE CH GR BE OR CH ST LE GR CH SE OR LE CH BE GR OR ST LE CH',
'OR CH LE ST GR CH BE OR LE CH GR SE LE CH OR BE GR ST LE CH'
].map(function(s){return s.split(' ')});
var payouts={CH:5,LE:10,OR:15,GR:25,BE:50,ST:100,SE:250},paths=[[1,1,1],[0,0,0],[2,2,2],[0,2,0],[2,0,2]];
var balance=500,bet=1,active=5,last=0,busy=false,stops=[0,1,2],wins=[],muted=false,musicStarted=false,ac=null;
var music=new Audio('../Fortuna-777/audio/casino-jazz.mp3');music.loop=true;music.volume=.25;
var b=document.getElementById('bet'),l=document.getElementById('lines'),s=document.getElementById('spin'),m=document.getElementById('mute');
function refresh(){document.getElementById('balance').textContent='CRÉDITOS: '+balance;document.getElementById('win').textContent='PRÉMIO: '+last;b.textContent='APOSTA: '+bet;l.textContent='LINHAS: '+active;b.disabled=l.disabled=s.disabled=busy;}
function at(c,r){return reels[c][(stops[c]+r-1+20)%20]}
function circle(x,y,r,c1,c2){var g=ctx.createRadialGradient(x-r*.32,y-r*.38,1,x,y,r);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function symbol(id,x,y){ctx.save();ctx.translate(x,y);ctx.shadowColor='#0006';ctx.shadowBlur=5;ctx.shadowOffsetY=3;
if(id==='CH'){ctx.strokeStyle='#38703a';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-18,8);ctx.quadraticCurveTo(-8,-22,7,-30);ctx.quadraticCurveTo(26,-12,20,9);ctx.stroke();circle(-18,12,19,'#ff8990','#ad0022');circle(20,12,18,'#ff8990','#9b0023')}
else if(id==='LE'||id==='OR'){ctx.save();if(id==='LE')ctx.scale(1.35,.8);circle(0,0,29,id==='LE'?'#fff8a1':'#ffce77',id==='LE'?'#c79500':'#db4e00');ctx.restore();ctx.fillStyle='#498b38';ctx.beginPath();ctx.ellipse(15,-26,17,7,-.4,0,Math.PI*2);ctx.fill()}
else if(id==='GR'){[[-15,-20],[12,-20],[-26,0],[0,0],[24,0],[-13,18],[13,18],[0,33]].forEach(function(p){circle(p[0],p[1]-4,13,'#d9a0ff','#6032a2')})}
else if(id==='BE'){var g=ctx.createLinearGradient(-30,0,30,0);g.addColorStop(0,'#a96c0c');g.addColorStop(.45,'#fff0a0');g.addColorStop(1,'#bc7a17');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-31,20);ctx.quadraticCurveTo(-16,8,-17,-15);ctx.quadraticCurveTo(0,-40,17,-15);ctx.quadraticCurveTo(16,8,31,20);ctx.closePath();ctx.fill();circle(0,24,7,'#ffdf78','#b06b0b')}
else if(id==='ST'){ctx.fillStyle='#ffca42';ctx.strokeStyle='#a36a12';ctx.lineWidth=2;ctx.beginPath();for(var i=0;i<10;i++){var a=-Math.PI/2+i*Math.PI/5,r=i%2?14:35;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.stroke()}
else{ctx.font='bold 76px Georgia';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=5;ctx.strokeStyle='#e3af44';ctx.strokeText('7',0,4);ctx.fillStyle='#c30b30';ctx.fillText('7',0,4)}ctx.restore()}
function draw(){ctx.fillStyle='#12261a';ctx.fillRect(0,0,840,300);for(var c=0;c<3;c++){var x=14+c*274;var g=ctx.createLinearGradient(0,8,0,292);g.addColorStop(0,'#aa9c76');g.addColorStop(.18,'#fff6d9');g.addColorStop(.5,'#fffdf4');g.addColorStop(.82,'#fff6d9');g.addColorStop(1,'#aa9c76');ctx.fillStyle=g;ctx.fillRect(x,10,264,280);ctx.strokeStyle='#c69b43';ctx.lineWidth=4;ctx.strokeRect(x,10,264,280);for(var r=0;r<3;r++){symbol(at(c,r),x+132,56+r*94);if(r<2){ctx.strokeStyle='#51442a22';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x+10,103+r*94);ctx.lineTo(x+254,103+r*94);ctx.stroke()}}}
wins.forEach(function(w){ctx.strokeStyle=['#f8b719','#da344f','#268ad1','#bc70ee','#39995a'][w.i];ctx.lineWidth=4;ctx.beginPath();paths[w.i].forEach(function(row,col){var x=146+274*col,y=56+94*row;col?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()})}
function audio(){try{if(!ac){var A=window.AudioContext||window.webkitAudioContext;if(A)ac=new A()}if(ac&&ac.state==='suspended')ac.resume().catch(function(){});if(!muted&&!musicStarted){musicStarted=true;music.play().catch(function(){musicStarted=false})}}catch(e){}}
function beep(freq,duration,type){if(!ac||muted)return;try{var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=type||'sine';o.frequency.value=freq;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+duration)}catch(e){}}
function spin(){if(busy)return;audio();if(balance<bet*active){status.textContent='Sem créditos virtuais. Recarrega a página para recomeçar.';return}busy=true;balance-=bet*active;last=0;wins=[];refresh();status.textContent='A rodar';var target=reels.map(function(){return Math.floor(Math.random()*20)}),start=performance.now(),prev=[-1,-1,-1],done=[false,false,false];function tick(t){var elapsed=t-start;for(var c=0;c<3;c++){if(done[c])continue;if(elapsed>=650+c*350){done[c]=true;stops[c]=target[c];beep(120,.16,'triangle')}else{var n=Math.floor(elapsed/65);if(n!==prev[c]){stops[c]=(stops[c]+1)%20;prev[c]=n}}}draw();if(done.every(Boolean)){for(var i=0;i<active;i++){var p=paths[i],a=at(0,p[0]),b=at(1,p[1]),c=at(2,p[2]);var v=a===b&&b===c?payouts[a]*bet:[a,b,c].filter(function(x){return x==='CH'}).length>=2?bet*2:0;if(v){last+=v;wins.push({i:i,v:v})}}balance+=last;busy=false;refresh();draw();status.textContent=last?'Prémio: '+last:'Pronto';if(last)beep(659,.3,'triangle')}else requestAnimationFrame(tick)}requestAnimationFrame(tick)}
s.addEventListener('click',spin);b.addEventListener('click',function(){bet=bet%10+1;refresh()});l.addEventListener('click',function(){active=active===5?1:active+2;refresh()});m.addEventListener('click',function(){muted=!muted;music.muted=muted;m.textContent=muted?'MUDO':'SOM';if(!muted)audio()});draw();refresh();status.textContent='Pronto';console.log('FORTUNA_V7_READY');
}catch(e){fail(e)}
})();
</script></body></html>
