name: Fortuna 777 Defold V6
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Fortuna-777-Defold/**'
      - '.github/workflows/fortuna-defold.yml'
permissions:
  contents: write
  pages: write
concurrency:
  group: fortuna-defold
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Test Lua rules
        working-directory: Fortuna-777-Defold
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
          luac5.1 -p main/game.gui_script
          lua5.1 tools/test_rules.lua
      - name: Download Defold
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 1.14.1 --repo defold/defold --pattern bob.jar --output "$RUNNER_TEMP/bob.jar"
      - name: Generate graphical and audio resources
        run: |
          python3 -m pip install Pillow
          python3 Fortuna-777-Defold/tools/generate_assets.py
      - name: Build WebAssembly
        working-directory: Fortuna-777-Defold
        run: |
          java -jar "$RUNNER_TEMP/bob.jar" --platform wasm-web --architectures wasm-web --variant debug --archive --bundle-output "$RUNNER_TEMP/fortuna-out" resolve distclean build bundle
          test -s "$RUNNER_TEMP/fortuna-out/Fortuna777/index.html"
      - name: Test compiled game on a touch browser
        run: |
          npm install --prefix "$RUNNER_TEMP/fortuna-test" playwright
          "$RUNNER_TEMP/fortuna-test/node_modules/.bin/playwright" install --with-deps chromium
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/fortuna-out/Fortuna777" &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          NODE_PATH="$RUNNER_TEMP/fortuna-test/node_modules" node Fortuna-777-Defold/tools/smoke.cjs
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fortuna-browser-test
          path: ${{ runner.temp }}/fortuna-*.png
          if-no-files-found: ignore
      - name: Publish built game without replacing V5
        run: |
          mkdir -p Fortuna-777-V6
          cp -a "$RUNNER_TEMP/fortuna-out/Fortuna777/." Fortuna-777-V6/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Fortuna-777-V6
          if ! git diff --cached --quiet; then
            git commit -m "Publish Fortuna 777 Defold V6"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Check publication files
        run: |
          test -s Fortuna-777-V6/index.html
          test -s Fortuna-777-V6/Fortuna777.wasm
          test -s Fortuna-777-V6/archive/archive_files.json
      - name: Save compiled build
        uses: actions/upload-artifact@v4
        with:
          name: fortuna-777-defold-web
          path: Fortuna-777-V6/
          if-no-files-found: error
