name: Mega Drive NX Next | Genesis 3 VA2
on:
  workflow_dispatch:
  push:
    paths:
      - 'MegaDrive-NX-Next/**'
      - '.github/workflows/megadrive-nx-next.yml'
permissions:
  contents: read
jobs:
  board-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python sources
        run: python3 -m compileall -q MegaDrive-NX-Next
      - name: Run unit and integration tests
        run: PYTHONPATH=MegaDrive-NX-Next python3 -m unittest discover -s MegaDrive-NX-Next -p 'test_*.py' -v
      - name: CPU smoke diagnostic
        run: python3 MegaDrive-NX-Next/diagnostic_cpu_smoke.py
      - name: VDP VBlank smoke diagnostic
        run: python3 MegaDrive-NX-Next/diagnostic_vblank_smoke.py
      - name: Explicitly report implementation status
        run: |
          echo "Genesis 3 VA2 board research scaffold validated."
          echo "315-6123 executable hardware core: NOT YET IMPLEMENTED."
          echo "Switch NRO: NOT YET AVAILABLE."
