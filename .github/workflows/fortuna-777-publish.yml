name: Publicar Fortuna 777
on:
  push:
    branches: [main]
    paths: [Fortuna-777-Pages.zip]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: fortuna-777-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Extrair e compilar
        run: |
          unzip -q Fortuna-777-Pages.zip -d "$RUNNER_TEMP/fortuna"
          cd "$RUNNER_TEMP/fortuna/fortuna-777"
          sed -i '/^[[:space:]]*playSpin(last);[[:space:]]*$/d' src/components/slot3d/useSlotGame.ts
          npm install --no-audit --no-fund
          npm run test
          npm run build
          test -f dist/index.html
          mkdir -p "$GITHUB_WORKSPACE/Fortuna-777"
          cp -a dist/. "$GITHUB_WORKSPACE/Fortuna-777/"
      - name: Publicar no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Fortuna-777/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publicar Fortuna 777"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Solicitar atualizacao do GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
