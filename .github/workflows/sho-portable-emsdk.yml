name: Super Hang-On portable WASM compiler
on:
  push:
    branches: [super-hang-on-pcb-native-v2]
    paths: ['.github/workflows/sho-portable-emsdk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.74'
      - name: Prepare relocatable SDK (no game files)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sho-sdk-parts
          # Use installed host Node rather than shipping a second copy.
          # Keep the complete upstream toolchain and cache: emcc expects both.
          tar -C "$EMSDK" -cf - upstream | xz -T2 -3 | split -d -a 2 -b 32m - /tmp/sho-sdk-parts/sdk.part.
          cd /tmp/sho-sdk-parts
          sha256sum sdk.part.* > SHA256SUMS
          ls -lh
      - uses: actions/upload-artifact@v4
        with:
          name: sho-sdk-checksums
          path: /tmp/sho-sdk-parts/SHA256SUMS
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: sho-sdk-00
          path: /tmp/sho-sdk-parts/sdk.part.00
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: sho-sdk-01
          path: /tmp/sho-sdk-parts/sdk.part.01
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: sho-sdk-02
          path: /tmp/sho-sdk-parts/sdk.part.02
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: sho-sdk-03
          path: /tmp/sho-sdk-parts/sdk.part.03
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: sho-sdk-04
          path: /tmp/sho-sdk-parts/sdk.part.04
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: sho-sdk-05
          path: /tmp/sho-sdk-parts/sdk.part.05
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: sho-sdk-06
          path: /tmp/sho-sdk-parts/sdk.part.06
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: sho-sdk-07
          path: /tmp/sho-sdk-parts/sdk.part.07
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: sho-sdk-08
          path: /tmp/sho-sdk-parts/sdk.part.08
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: sho-sdk-09
          path: /tmp/sho-sdk-parts/sdk.part.09
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: sho-sdk-10
          path: /tmp/sho-sdk-parts/sdk.part.10
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: sho-sdk-11
          path: /tmp/sho-sdk-parts/sdk.part.11
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
