name: Mega Drive NX build
on:
  workflow_dispatch:
  push:
    paths:
      - 'MegaDrive-NX/**'
      - '.github/workflows/megadrive-nx.yml'
permissions:
  contents: write
jobs:
  nro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: devkitpro/devkita64:20260219
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain and source checks
        run: |
          set -euo pipefail
          mkdir -p MegaDrive-NX/dist
          exec > >(tee MegaDrive-NX/dist/preflight-log.txt) 2>&1
          git --version
          python3 --version
          /opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc --version
          bash -n MegaDrive-NX/build.sh
          command -v git
          test -x /opt/devkitpro/portlibs/switch/bin/sdl2-config
          test -x /opt/devkitpro/tools/bin/elf2nro
          test -x /opt/devkitpro/tools/bin/nacptool
          python3 -m py_compile MegaDrive-NX/port.py MegaDrive-NX/diagnostic.py MegaDrive-NX/test_diagnostic_rom.py MegaDrive-NX/analyse_rom_boot_trace.py MegaDrive-NX/test_rom_boot_trace.py MegaDrive-NX/analyse_cpu_bus_trace.py MegaDrive-NX/test_cpu_bus_trace.py MegaDrive-NX/audit_generated_traces.py MegaDrive-NX/test_generated_trace_audit.py MegaDrive-NX/correlate_boot_traces.py MegaDrive-NX/test_correlate_boot_traces.py MegaDrive-NX/analyze_vdp_handshake.py MegaDrive-NX/test_vdp_handshake_analyzer.py
          python3 MegaDrive-NX/test_diagnostic_rom.py
          PYTHONPATH=MegaDrive-NX python3 -m unittest discover -s MegaDrive-NX -p "test_rom_boot_trace.py" -v
          PYTHONPATH=MegaDrive-NX python3 -m unittest discover -s MegaDrive-NX -p "test_cpu_bus_trace.py" -v
          PYTHONPATH=MegaDrive-NX python3 -m unittest discover -s MegaDrive-NX -p "test_cpu_trace_patch.py" -v
          PYTHONPATH=MegaDrive-NX python3 -m unittest discover -s MegaDrive-NX -p "test_generated_trace_audit.py" -v
          PYTHONPATH=MegaDrive-NX python3 -m unittest discover -s MegaDrive-NX -p "test_correlate_boot_traces.py" -v
          python3 -m py_compile MegaDrive-NX/board_profiles.py MegaDrive-NX/va4_bus_diagnostics.py
          PYTHONPATH=MegaDrive-NX python3 -m unittest discover -s MegaDrive-NX -p "test_board_profiles.py" -v
          PYTHONPATH=MegaDrive-NX python3 -m unittest discover -s MegaDrive-NX -p "test_va4_bus_diagnostics.py" -v
          PYTHONPATH=MegaDrive-NX python3 -m unittest discover -s MegaDrive-NX -p "test_vdp_handshake_analyzer.py" -v
          python3 -m py_compile MegaDrive-NX/vdp_transaction_diagnostic.py
      - name: Compile and package NRO
        run: |
          set -o pipefail
          mkdir -p MegaDrive-NX/dist
          bash MegaDrive-NX/build.sh 2>&1 | tee MegaDrive-NX/dist/build-log.txt
      - name: Explain failed build stage
        if: failure()
        run: |
          echo "=== Last preflight lines ==="
          tail -n 35 MegaDrive-NX/dist/preflight-log.txt 2>/dev/null || true
          echo "=== Last build lines ==="
          tail -n 70 MegaDrive-NX/dist/build-log.txt 2>/dev/null || true
          echo "=== Generated source ==="
          ls -l MegaDrive-NX/build/md.c MegaDrive-NX/build/Umbrella-MegaDrive-NX.elf 2>/dev/null || true
      - name: Preserve build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Umbrella-MegaDrive-NX-build-failure
          path: |
            MegaDrive-NX/dist/build-log.txt
            MegaDrive-NX/dist/preflight-log.txt
            MegaDrive-NX/build/md.c
            MegaDrive-NX/build/md.h
            MegaDrive-NX/SD_IO_AUDIT.md
            MegaDrive-NX/VA4_V5_8_PLAN.md
          if-no-files-found: warn
      - name: Verify compiled ELF architecture
        run: |
          set -euo pipefail
          elf=MegaDrive-NX/build/Umbrella-MegaDrive-NX.elf
          test -s "$elf"
          /opt/devkitpro/devkitA64/bin/aarch64-none-elf-readelf -h "$elf" | tee MegaDrive-NX/dist/elf-header.txt
          grep -q 'Machine:.*AArch64' MegaDrive-NX/dist/elf-header.txt
          /opt/devkitpro/devkitA64/bin/aarch64-none-elf-readelf -sW "$elf" > MegaDrive-NX/dist/elf-symbols.txt
          echo "ELF architecture verified: AArch64"
      - name: Verify NRO header and hash
        run: |
          printf "Git commit: %s\nWorkflow run: %s\n" "$GITHUB_SHA" "$GITHUB_RUN_ID" > MegaDrive-NX/dist/build-provenance.txt
          python3 - <<'PY'
          from pathlib import Path
          import struct, hashlib
          f = Path("MegaDrive-NX/dist/Umbrella-MegaDrive-NX.nro")
          b = f.read_bytes()
          assert len(b) >= 0x80 and b[0x10:0x14] == b"NRO0", "Invalid NRO header"
          size = struct.unpack_from("<I", b, 0x18)[0]
          assert 0x80 <= size <= len(b), "Invalid NRO image size"
          print("NRO bytes:", len(b), "SHA256:", hashlib.sha256(b).hexdigest())
          f.with_suffix(".sha256").write_text(hashlib.sha256(b).hexdigest()+"  "+f.name+"\n")
          PY
      - name: Package corresponding source
        run: |
          mkdir -p MegaDrive-NX/dist/source
          cp MegaDrive-NX/{build.sh,port.py,diagnostic.py,test_diagnostic_rom.py,analyse_rom_boot_trace.py,test_rom_boot_trace.py,analyse_cpu_bus_trace.py,test_cpu_bus_trace.py,test_cpu_trace_patch.py,audit_generated_traces.py,test_generated_trace_audit.py,correlate_boot_traces.py,test_correlate_boot_traces.py,analyze_vdp_handshake.py,test_vdp_handshake_analyzer.py,nx_frontend.c,nx_frontend.h,board_profiles.py,test_board_profiles.py,va4_bus_diagnostics.py,test_va4_bus_diagnostics.py,VA4_V5_8_PLAN.md,README.md} MegaDrive-NX/dist/source/
          tar --exclude='*.elf' --exclude='*.nro' --exclude='*.nacp' -czf MegaDrive-NX/dist/source/patched-source.tar.gz -C MegaDrive-NX/build .
          rm -rf MegaDrive-NX/dist/source/__pycache__
      - uses: actions/upload-artifact@v4
        with:
          name: Umbrella-MegaDrive-NX
          path: MegaDrive-NX/dist/
          if-no-files-found: error
  release:
    needs: nro
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Umbrella-MegaDrive-NX
          path: dist
      - name: Publish V5.7
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum -c Umbrella-MegaDrive-NX.sha256
          tar -czf Umbrella-MegaDrive-NX-source.tar.gz source
          tag=megadrive-nx-v5.7
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title 'Umbrella Mega Drive NX V5.7' --notes 'VDP handshake trace and read-only analyzer regression included. AArch64 build verification; Switch hardware validation pending.'
          fi
          gh release upload "$tag" Umbrella-MegaDrive-NX.nro Umbrella-MegaDrive-NX.sha256 Umbrella-MegaDrive-NX-source.tar.gz build-provenance.txt --clobber
          gh release edit "$tag" --target "$GITHUB_SHA" \
            --notes "Build commit: $GITHUB_SHA. Workflow run: $GITHUB_RUN_ID. AArch64 ELF and NRO header checked by CI; Switch hardware validation pending."
