name: Publicar jogos Umbrella no GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'Pinball-Action/**'
      - 'Reactor-Rush/**'
      - 'Super-Pinball-Action/**'
      - 'Reactor-Rush/**'
      - 'Super-Pinball-Action/**'
      - 'Super-Hang-On/**'
      - 'Fortuna-777/**'
      - 'Fortuna-777-V6/**'
      - 'Fortuna-777-V7/**'
      - 'Fortuna-777-V8/**'
      - 'index.html'
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['Fortuna 777 Defold V6', 'Mega Drive NX build']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Ler ficheiros
        uses: actions/checkout@v4
      - name: Preparar pagina estatica
        run: |
          mkdir -p public
          if [ -f index.html ]; then cp index.html public/index.html; fi
          for game in Pinball-Action Reactor-Rush Super-Pinball-Action Super-Hang-On Fortuna-777 Fortuna-777-V6 Fortuna-777-V7 Fortuna-777-V8; do
            if [ -d "$game" ]; then cp -R "$game" public/; fi
          done
          test -s public/Fortuna-777-V7/index.html
          nx_base=https://github.com/hunderburn39-beep/Umbrella/releases/download/megadrive-nx-v0.3
          if ! curl --fail --location --retry 3 --output public/nx.nro "$nx_base/Umbrella-MegaDrive-NX.nro"; then
            nx_base=https://github.com/hunderburn39-beep/Umbrella/releases/download/megadrive-nx-v0.2
            curl --fail --location --retry 3 --output public/nx.nro "$nx_base/Umbrella-MegaDrive-NX.nro"
          fi
          curl --fail --location --retry 3 --output /tmp/nx.sha256 "$nx_base/Umbrella-MegaDrive-NX.sha256"
          echo "$(cut -d ' ' -f1 /tmp/nx.sha256)  public/nx.nro" | sha256sum -c -
          touch public/.nojekyll
      - name: Bundle Babylon.js locally for Fortuna V8
        run: |
          test -s public/Fortuna-777-V8/index.html
          node --check public/Fortuna-777-V8/scene.js
          mkdir -p public/Fortuna-777-V8/vendor
          npm install --prefix "$RUNNER_TEMP/babylon-v8" --no-audit --no-fund babylonjs@7.0.0
          cp "$RUNNER_TEMP/babylon-v8/node_modules/babylonjs/babylon.js" public/Fortuna-777-V8/vendor/
          test -s public/Fortuna-777-V8/vendor/babylon.js
      - name: Ativar GitHub Pages, se permitido
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Enviar ficheiros do jogo
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar jogo
        id: deployment
        uses: actions/deploy-pages@v4
