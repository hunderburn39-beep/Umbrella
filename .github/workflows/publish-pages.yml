name: Publicar jogos Umbrella no GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'Pinball-Action/**'
      - 'Reactor-Rush/**'
      - 'Super-Pinball-Action/**'
      - 'Reactor-Rush/**'
      - 'Super-Pinball-Action/**'
      - 'Super-Hang-On/**'
      - 'Fortuna-777/**'
      - 'Fortuna-777-V6/**'
      - 'index.html'
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['Fortuna 777 Defold V6']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Ler ficheiros
        uses: actions/checkout@v4
      - name: Preparar pagina estatica
        run: |
          mkdir -p public
          if [ -f index.html ]; then cp index.html public/index.html; fi
          for game in Pinball-Action Reactor-Rush Super-Pinball-Action Super-Hang-On Fortuna-777 Fortuna-777-V6; do
            if [ -d "$game" ]; then cp -R "$game" public/; fi
          done
          test -s public/Fortuna-777-V6/index.html
          test -s public/Fortuna-777-V6/Fortuna777.wasm
          test -s public/Fortuna-777-V6/archive/archive_files.json
          touch public/.nojekyll
      - name: Ativar GitHub Pages, se permitido
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Enviar ficheiros do jogo
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar jogo
        id: deployment
        uses: actions/deploy-pages@v4
