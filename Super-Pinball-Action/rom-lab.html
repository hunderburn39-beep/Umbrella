<!doctype html><html lang="pt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Super Pinball Action — ROM Lab</title><style>body{background:#10151b;color:#eaf0f7;font:16px system-ui;margin:20px}h1{font-size:22px}label{display:inline-block;margin:8px 12px 8px 0}select,input,button{font:inherit;background:#23303c;color:white;border:1px solid #607080;border-radius:6px;padding:8px}canvas{width:100%;max-width:1024px;image-rendering:pixelated;background:#1c2630;display:block}p{max-width:850px}#status{color:#a9cfe7}</style>
<h1>Super Pinball Action — laboratório de sprites</h1><p>Abre o teu spbactn.zip local (merged) para descodificar os dados originais no navegador. Nada é enviado para um servidor. As paletas são bancos estáticos; a associação de cada sprite ao seu grupo de cor ainda requer análise do jogo.</p>
<input id="zip" type="file" accept=".zip"><div id="status">Seleciona a ROM.</div><div>
<label>Região <select id="region"><option value="sprites">Sprites (EUA/Japão)</option><option value="fg">Primeiro plano</option><option value="bg">Fundo</option><option value="ps">Sprites do protótipo</option><option value="pf">Primeiro plano do protótipo</option><option value="pb">Fundo do protótipo (incerto)</option><option value="pe">Ecrã extra do protótipo</option></select></label>
<label>Dimensão <select id="size"><option>8</option><option>16</option><option>32</option><option>64</option></select></label>
<label>Paleta <select id="pal"><option value="gray">Diagnóstico</option><option>us0</option><option>us1</option><option>us2</option><option>us3</option><option>jp0</option><option>jp1</option><option>jp2</option><option>jp3</option></select></label><label>Grupo de cor <input id="group" type="number" min="0" max="127" value="0" style="width:60px"></label>
<label>Primeiro grupo <input id="offset" type="number" min="0" value="0" style="width:85px"></label><button id="prev">Anterior</button> <button id="next">Seguinte</button> <button id="save">Guardar PNG</button></div><p id="range"></p><canvas id="canvas"></canvas>
<script>
const $=s=>document.getElementById(s),can=$('canvas'),ctx=can.getContext('2d');let files={},regions={},banks={};
function inter(a,b){if(a.length!==b.length)throw Error('Tamanhos diferentes');let r=new Uint8Array(a.length*2);for(let i=0;i<a.length;i++){r[2*i]=a[i];r[2*i+1]=b[i]}return r}
function cat(a,b){let r=new Uint8Array(a.length+b.length);r.set(a);r.set(b,a.length);return r}
async function unzip(file){let a=new Uint8Array(await file.arrayBuffer()),v=new DataView(a.buffer),e=a.length-22;while(e>=Math.max(0,a.length-65557)&&v.getUint32(e,true)!==0x06054b50)e--;if(e<0||v.getUint32(e,true)!==0x06054b50)throw Error('ZIP inválido');let n=v.getUint16(e+10,true),p=v.getUint32(e+16,true),o={};for(let i=0;i<n;i++){if(v.getUint32(p,true)!==0x02014b50)throw Error('Diretório ZIP inválido');let method=v.getUint16(p+10,true),len=v.getUint32(p+20,true),plain=v.getUint32(p+24,true),nl=v.getUint16(p+28,true),el=v.getUint16(p+30,true),cl=v.getUint16(p+32,true),h=v.getUint32(p+42,true),name=new TextDecoder().decode(a.slice(p+46,p+46+nl));p+=46+nl+el+cl;if(name.endsWith('/'))continue;if(v.getUint32(h,true)!==0x04034b50)throw Error('Cabeçalho ZIP inválido');let start=h+30+v.getUint16(h+26,true)+v.getUint16(h+28,true),raw=a.slice(start,start+len);if(method===8)raw=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());else if(method!==0)throw Error('Compressão não suportada');if(raw.length!==plain)throw Error('Tamanho inválido: '+name);o[name]=raw}return o}
function code(x,y){let n=0;for(let i=0;i<3;i++)n|=((x>>i)&1)<<(2*i)|((y>>i)&1)<<(2*i+1);return n}
function reverse(n){return ((n&1)<<3)|((n&2)<<1)|((n&4)>>1)|((n&8)>>3)}
function pen(b,mode,t,x,y){if(mode==='bg'){let k=x%8,q=(k%4<2?b.length/2:0)+t*32+Math.floor(x/8)*16+y*2+Math.floor(k/4);return reverse(k%2===0?b[q]&15:b[q]>>4)}let stride=mode==='sprite'?32:64,q=t*stride+Math.floor(x/8)*32+y*4+Math.floor((x%8)/2);return x%2===0?b[q]>>4:b[q]&15}
function render(){if(!regions[$('region').value])return;let [b,mode]=regions[$('region').value],w=mode==='sprite'?8:16,dim=mode==='sprite'?Number($('size').value)/8:1,sx=w*dim,sy=8*dim,cells=dim*dim,n=Math.floor(b.length/(mode==='sprite'?32:64)/cells),cols=Math.max(1,Math.min(32,Math.floor(512/sx))),page=cols*Math.max(1,Math.floor(384/sy)),start=Math.min(Math.max(0,Number($('offset').value)||0),Math.max(0,n-1)),count=Math.min(page,n-start),g=Math.min(127,Math.max(0,Number($('group').value)||0)),palette=banks[$('pal').value];$('offset').value=start;$('size').disabled=mode!=='sprite';can.width=cols*sx;can.height=Math.ceil(count/cols)*sy;let im=ctx.createImageData(can.width,can.height);
for(let j=0;j<count;j++)for(let y=0;y<sy;y++)for(let x=0;x<sx;x++){let t=(start+j)*cells+code(Math.floor(x/w),Math.floor(y/8)),p=pen(b,mode,t,x%w,y%8),v=palette?palette[g*16+p]:p*0x111,k=4*((Math.floor(j/cols)*sy+y)*can.width+(j%cols)*sx+x);im.data[k]=(v&15)*17;im.data[k+1]=((v>>4)&15)*17;im.data[k+2]=((v>>8)&15)*17;im.data[k+3]=p?255:0}ctx.putImageData(im,0,0);$('range').textContent='Grupos '+start+'–'+(start+count-1)+' de '+n+' · primeiro ID de célula '+start*cells+' · '+sx+'×'+sy;$('next').onclick=()=>{$('offset').value=Math.min(n-1,start+page);render()};$('prev').onclick=()=>{$('offset').value=Math.max(0,start-page);render()}}
$('zip').onchange=async()=>{try{files=await unzip($('zip').files[0]);let r=n=>{if(!files[n])throw Error('Falta '+n);return files[n]},p='spbactnp/';regions={sprites:[inter(r('b-u110'),r('b-u111')),'sprite'],fg:[inter(r('b-u98'),r('b-u99')),'fg'],bg:[cat(r('b-u104'),r('b-u105')),'bg'],ps:[cat(r(p+'spa_sp0_4-18-p-8.5m'),r(p+'spa_sp1_3-14-a-10.4m')),'sprite'],pf:[inter(r(p+'spa_back0_split0_5-17-p-1.27b'),r(p+'spa_back0_split1_5-17-p-1.27c')),'fg'],pb:[inter(r(p+'spa_back1_split0_3-14-a-11.26b'),r(p+'spa_back1_split1_3-14-a-11.26c')),'fg'],pe:[r(p+'spa.25c'),'sprite']};for(let [key,b,base] of [['us',inter(r('rom1.bin'),r('rom2.bin')),0x34cf6],['jp',inter(r('spbactnj/a-u68.1'),r('spbactnj/a-u67.2')),0x34c70]]){let v=new DataView(b.buffer);for(let i=0;i<4;i++)banks[key+i]=Array.from({length:2048},(_,j)=>v.getUint16(base+i*4096+j*2))}$('status').textContent=Object.keys(files).length+' ficheiros lidos. Escolhe uma região.';render()}catch(e){$('status').textContent='Erro: '+e.message}};
for(let id of ['region','size','pal','group','offset'])$(id).onchange=()=>{if(id==='region'||id==='size')$('offset').value=0;render()};$('save').onclick=()=>{if(!can.width)return;let a=document.createElement('a');a.href=can.toDataURL('image/png');a.download='spbactn-'+$('region').value+'-'+$('offset').value+'.png';a.click()};
</script></html>
