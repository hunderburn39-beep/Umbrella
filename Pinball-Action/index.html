<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#10091c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pinball Action V9.14 — Entrada</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080711;overscroll-behavior:none;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{height:100dvh}
#arcade{position:fixed;inset:0;display:block;width:100%;height:100%;border:0;z-index:1;opacity:0;pointer-events:none;background:#000}
#intro{position:fixed;inset:0;z-index:10;display:flex;justify-content:center;align-items:center;overflow:hidden;padding:env(safe-area-inset-top) 22px env(safe-area-inset-bottom);background:radial-gradient(ellipse at 50% 36%,#533178 0%,#211333 38%,#090711 82%);color:#f8ecda;text-align:center}
#intro[hidden]{display:none!important}
#intro:before{content:"";position:absolute;inset:0;opacity:.28;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0px,transparent 3px,#000 4px)}
.panel{position:relative;display:flex;flex-direction:column;align-items:center;gap:23px;width:min(100%,460px)}
.kicker{font-size:clamp(12px,2.7vw,15px);font-weight:800;letter-spacing:.36em;color:#f6c77b}
h1{margin:0;line-height:.88;font-size:clamp(53px,13vw,86px);font-style:italic;font-weight:1000;letter-spacing:-.07em;text-shadow:0 3px #b23a48,0 6px #631e46,0 13px 19px #07030a}
h1 .top{display:block;color:#ffe16e}
h1 .bottom{display:block;color:#fef6e5;font-size:.78em;letter-spacing:.03em}
.rule{width:min(77%,270px);height:3px;background:linear-gradient(90deg,transparent,#ffcc73,transparent)}
.subtitle{color:#d9c4e8;font-size:13px;letter-spacing:.1em;margin:0}
#enter{font-size:clamp(22px,6vw,27px);letter-spacing:.1em;min-height:66px;width:min(300px,100%);border-radius:12px;border:3px solid #ffdb81;background:linear-gradient(#329c64,#135733);color:white;font-weight:900;box-shadow:0 5px #052b1b,0 15px 35px #080611;touch-action:manipulation;cursor:pointer}
#enter:active{transform:translateY(3px);box-shadow:0 2px #052b1b}
#enter:disabled{opacity:.68;cursor:default}
#message{max-width:340px;min-height:3em;margin:0;font-size:13px;line-height:1.5;color:#e6d8ec}
#silent{background:none;border:1px solid #806b8f;color:#e3d2ef;font-weight:650;border-radius:8px;padding:8px 18px;cursor:pointer}
#silent[hidden]{display:none}
.version{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));z-index:2;font-size:13px;font-weight:800;letter-spacing:.08em;color:#f8ecda;pointer-events:none}
@media(orientation:landscape) and (max-height:550px){
.panel{gap:12px}h1{font-size:clamp(36px,11vh,60px)}#enter{min-height:48px;font-size:18px}.rule{height:2px}.subtitle{display:none}
}
.original-logo{width:min(100%,440px);margin:0;line-height:0;filter:drop-shadow(0 0 2px white) drop-shadow(0 0 12px #ef30d4) drop-shadow(0 12px 18px #06030a)}
.original-logo svg{display:block;width:100%;height:auto;overflow:visible;shape-rendering:geometricPrecision}
@media(orientation:landscape) and (max-height:550px){.original-logo{width:min(52vh,300px)}}
#settings-button{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));z-index:3;background:#211b31;border:1px solid #ae92be;color:#e9dcef;border-radius:7px;padding:8px 12px;font-size:12px;font-weight:700;touch-action:manipulation;cursor:pointer}
#settings-button:disabled{opacity:.4}
#settings[hidden]{display:none!important}
#settings{position:fixed;inset:0;z-index:20;overflow:auto;overscroll-behavior:contain;background:#090a10;color:#eee;padding:max(18px,env(safe-area-inset-top)) 18px max(20px,env(safe-area-inset-bottom));text-align:left}
#settings .settings-inner{max-width:500px;margin:auto}
#settings h2{font-size:20px;color:#f5ce82;margin:4px 0 8px}
#settings h3{font-size:13px;letter-spacing:.12em;color:#bda3ce;margin:19px 0 8px}
#settings label{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #34303d;font-size:14px}
#settings select{font:inherit;font-size:16px;padding:7px 4px;max-width:54%;min-width:110px;color:#eee;border:1px solid #675b78;border-radius:6px;background:#252133}
#settings .settings-buttons{display:flex;flex-wrap:wrap;gap:9px;margin:15px 0}
#settings button{flex:1;font:inherit;font-weight:750;padding:12px 8px;background:#292438;color:#faf2dc;border:1px solid #a793b5;border-radius:8px;cursor:pointer}
#settings #save-settings{background:#22603e;border-color:#8bcf9c}
#dip-status{font-size:12px;color:#dcc6e9}
/* Remastered cabinet marquee; original logo geometry remains intact. */
#intro{background:radial-gradient(ellipse at 50% 27%,#20394f 0%,#121e35 36%,#070b16 72%);isolation:isolate}
#intro:before{opacity:1;background:linear-gradient(145deg,transparent 20%,#91d8ff16 20.2%,#91d8ff09 33%,transparent 33.2%),repeating-linear-gradient(135deg,#ffffff04 0px,#ffffff04 1px,transparent 1px,transparent 8px);z-index:-1}
#intro:after{content:"";position:absolute;inset:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));border:1px solid #94b6d24a;border-radius:22px;pointer-events:none;z-index:-1;box-shadow:inset 0 0 28px #000a,0 0 0 4px #0005}
.original-logo{filter:drop-shadow(0 7px 0 #050916) drop-shadow(0 0 20px #6486d85c) drop-shadow(0 14px 20px #000a)}
.kicker{color:#c2d9ed;letter-spacing:.24em}
.rule{height:2px;width:min(90%,310px);background:linear-gradient(90deg,transparent,#57788b,#f0fbff,#57788b,transparent)}
#enter{border:2px solid #c4e3e9;background:linear-gradient(170deg,#67c3a6,#176b5a 39%,#10443e 75%,#207868);box-shadow:inset 0 2px 1px #ffffff6b,0 5px 0 #071b22,0 12px 26px #000a;color:#effffa;text-shadow:0 1px 3px #001a16}
#enter:active{box-shadow:inset 0 2px 9px #0007,0 2px #071b22}
#settings-button{background:linear-gradient(#314253,#161f2b);border-color:#71899e;color:#e7f2fa}

}
const mainArtFile=document.getElementById('main-art-file'),mainArtStatus=document.getElementById('main-art-status');
mainArtFile.addEventListener('change',async()=>{
 const file=mainArtFile.files?.[0];if(!file)return;
 mainArtStatus.textContent='A aplicar ilustração…';
 try{
  const result=await child().__PB_MAIN_ART_SET(file);
  mainArtStatus.textContent=result.loaded?(result.saved?'Fundo aplicado e guardado neste dispositivo.':'Fundo aplicado nesta sessão; armazenamento indisponível.'):'O pedido foi substituído.';
 }catch(error){mainArtStatus.textContent=error.message||'Não foi possível carregar a imagem.';}
 mainArtFile.value='';
});
document.getElementById('main-art-reset').addEventListener('click',async()=>{
 try{await child().__PB_MAIN_ART_RESET();mainArtStatus.textContent='Fundo reposto.';}catch{mainArtStatus.textContent='Não foi possível repor o fundo.';}
});
settingsButton.addEventListener('click',()=>{
 const w=child();if(!w||opening||entered||testing)return;
 showDips(w.__PB_DIP_GET());settings.hidden=false;
});
document.getElementById('reset-settings').addEventListener('click',()=>showDips({sw1:64,sw2:0}));
document.getElementById('close-settings').addEventListener('click',()=>{settings.hidden=true;});
document.getElementById('save-settings').addEventListener('click',()=>{
 const w=child(),d={sw1:64,sw2:0};if(!w)return;
 for(const [bank,mask,,,el] of fields)d[bank]|=Number(el.value)&mask;
 if(!w.__PB_DIP_SET(d.sw1,d.sw2)){dipStatus.textContent='Não foi possível aplicar as opções.';return;}
 try{localStorage.setItem('pb-original-dips-v1',JSON.stringify(d));}catch{dipStatus.textContent='Aplicado nesta sessão; armazenamento indisponível.';return;}
 settings.hidden=true;
 message.textContent='Configurações guardadas · prontas para jogar';
});
let ready=false,opening=false,entered=false,interval=null,lastTouch=-Infinity;
function child(){
 try{
  const w=frame.contentWindow;
  return w&&typeof w.__PB_ENTER_ARCADE==='function'&&
   typeof w.__PB_REVEAL_ARCADE==='function'&&
   typeof w.__PB_ENTRY_STATUS==='function'?w:null;
 }catch{return null;}
}
function stopCheck(){if(interval!==null){clearInterval(interval);interval=null;}}
function readyCheck(){
 if(ready)return;
 if(!child())return;
 ready=true;
 button.disabled=false;
 settingsButton.disabled=typeof child().__PB_DIP_SET!=='function';
 button.textContent='ENTRAR';
 message.textContent='Carrega em ENTRAR para ouvir a música de título e abrir o jogo';
}
frame.addEventListener('load',readyCheck);
const loadPoll=setInterval(()=>{
 readyCheck();if(ready)clearInterval(loadPoll);
},120);
function reveal(w){
 if(entered)return;
 entered=true;opening=false;stopCheck();
 w.__PB_REVEAL_ARCADE();
 frame.style.opacity='1';
 frame.style.pointerEvents='auto';
 frame.removeAttribute('aria-hidden');
 intro.hidden=true;
}
function begin(){
 if(entered||opening||testing)return;
 const w=child();
 if(!w){
  button.textContent='A CARREGAR…';
  button.disabled=true;
  message.textContent='A preparar a máquina original';
  return;
 }
 opening=true;
 // Make the iframe renderable *during* the user's gesture. The opaque
 // entrance screen still covers it, so no arcade commands appear yet.
 frame.style.opacity='1';
 button.disabled=true;
 button.textContent='A INICIAR…';
 silent.hidden=true;
 message.textContent='A iniciar a música original do título…';
 // Crucial for Safari: call the SAME-ORIGIN game AudioContext inside this
 // exact physical touch/click gesture, not in a post-load or timer callback.
 try{w.__PB_ENTER_ARCADE();if(typeof w.__PB_DEMO_SOUNDS==='function'&&!w.__PB_DEMO_SOUNDS()){reveal(w);return;}}catch(e){
  opening=false;button.disabled=false;button.textContent='ENTRAR';
  message.textContent='Não foi possível ativar o áudio. Volta a tocar em ENTRAR.';
  silent.hidden=false;
  return;
 }
 const start=performance.now();
 function check(){
  if(entered)return;
  const game=child();
  if(!game)return;
  let state=null;
  try{state=game.__PB_ENTRY_STATUS();}catch{}
  if(state?.context==='running'&&state.titleAudible){
   reveal(game);
  }else if(performance.now()-start>=8500){
   stopCheck();opening=false;
   button.disabled=false;button.textContent='ENTRAR';
   message.textContent='O Safari ainda não libertou o som. Podes tentar de novo.';
   silent.hidden=false;
  }
 }
 interval=setInterval(check,55);
 check();
}
button.addEventListener('touchend',e=>{
 if(e.cancelable)e.preventDefault();
 lastTouch=performance.now();
 begin();
},{passive:false});
button.addEventListener('click',e=>{
 if(performance.now()-lastTouch<800){e.preventDefault();return;}
 begin();
});
silent.addEventListener('click',()=>{
 const w=child();if(!w)return;
 try{w.__PB_ENTER_SILENT();}catch{return;}
 entered=true;stopCheck();
 frame.style.opacity='1';frame.style.pointerEvents='auto';
 frame.removeAttribute('aria-hidden');intro.hidden=true;
});
window.addEventListener('pageshow',readyCheck);
})();
</script>
</body>
</html>
